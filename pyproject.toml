[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-quant-research"
version = "0.1.0"
description = "Research-grade pricing, arbitrage, and market-making framework for Kalshi binary prediction markets (paper-trading only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "scipy>=1.11",  # LP oracle in tests: independent check that constraint sets are complete
]

[tool.hatch.build.targets.wheel]
packages = ["kalshi_client", "market", "data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 20
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal payloads in fixtures are clearer unwrapped
"data/schemas/ddl.py" = ["E501"]  # declarative table docs read better unwrapped
"data/collectors/run.py" = ["E501"]  # CLI report strings
"scripts/*" = ["E501"]  # research reports print wide tables
