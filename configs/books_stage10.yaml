# Stage 10 CONFIRMATORY recording: markets that settle within 3 h, recorded fresh for 6 hours (from
# 2026-09-20 07:40 UTC) AFTER the Stage 9 results were known. The adaptive market maker is designed and
# fitted on older data only; this database is opened once, with the code frozen. Selection uses only
# scheduled expiry: no look-ahead.
job: books
db_path: var/books_stage10.duckdb
mode: rest
interval_s: 3
duration_s: 21600
heartbeat_s: 30
metadata_refresh_s: 600
requests_per_second: 3
selection:
  top_events: 60
  max_tickers: 400
  min_event_markets: 1
  include_siblings: true
  max_hours_to_expiry: 3
